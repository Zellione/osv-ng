name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Build pinned SQLCipher
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output sqlcipher-4.18.0.tar.gz \
            https://github.com/sqlcipher/sqlcipher/archive/refs/tags/v4.18.0.tar.gz
          echo '1df02d1b346fa27feaf2da2cb2c0d8209e788248e461ec288718aa5d3e9643e5  sqlcipher-4.18.0.tar.gz' | sha256sum --check --strict
          tar --extract --file sqlcipher-4.18.0.tar.gz
          cd sqlcipher-4.18.0
          CFLAGS='-O2 -DSQLITE_HAS_CODEC -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown' \
          LDFLAGS='-lcrypto -Wl,-soname,libsqlcipher.so.0' \
            ./configure \
              --prefix=/usr/local \
              --disable-static \
              --enable-shared \
              --disable-tcl \
              --disable-load-extension \
              --with-tempstore=yes \
              --fts5
          make --jobs 2
          sudo make install
          sudo mv /usr/local/bin/sqlite3 /usr/local/bin/sqlcipher
          sudo mv /usr/local/lib/libsqlite3.so.3.53.4 /usr/local/lib/libsqlcipher.so.0.8.6
          sudo ln --symbolic libsqlcipher.so.0.8.6 /usr/local/lib/libsqlcipher.so.0
          sudo ln --symbolic libsqlcipher.so.0 /usr/local/lib/libsqlcipher.so
          sudo rm /usr/local/lib/libsqlite3.so /usr/local/lib/libsqlite3.so.0
          sudo mv /usr/local/lib/pkgconfig/sqlite3.pc /usr/local/lib/pkgconfig/sqlcipher.pc
          sudo sed --in-place 's/-lsqlite3/-lsqlcipher/' /usr/local/lib/pkgconfig/sqlcipher.pc
          sudo ldconfig
      - name: Check formatting
        run: |
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Lint
        run: cargo +1.98.0 clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.98.0 test --workspace --all-targets --all-features
      - name: Verify the documented single-test command
        run: cargo +1.98.0 test -p osv-test-support tests::secret_canary_debug_is_redacted -- --exact

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install cargo-audit
        run: cargo +1.98.0 install cargo-audit --version 0.22.2 --locked
        working-directory: /tmp
      - name: Audit dependencies
        run: |
          cargo +1.98.0 audit
          cargo +1.98.0 audit --file fuzz/Cargo.lock

  dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Install cargo-deny
        run: cargo +1.98.0 install cargo-deny --version 0.20.2 --locked
        working-directory: /tmp
      - name: Check dependency policy
        run: |
          cargo +1.98.0 deny check advisories bans licenses sources
          cargo +1.98.0 deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check advisories bans licenses sources

  fuzz-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned nightly
        run: rustup toolchain install nightly-2026-09-06 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-09-06 install cargo-fuzz --version 0.13.2 --locked
        working-directory: /tmp
      - name: Permit LeakSanitizer tracing on the ephemeral runner
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Run the ASan/LSan-backed fuzz smoke target
        run: cargo +nightly-2026-09-06 fuzz run secret-canary -- -max_total_time=20
        env:
          ASAN_OPTIONS: detect_leaks=1
      - name: Restore restricted ptrace policy
        if: always()
        run: sudo sysctl -w kernel.yama.ptrace_scope=1

  flatpak-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
      - name: Install the pinned SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build and test offline inside the SDK
        run: flatpak-builder --force-clean --disable-rofiles-fuse .flatpak-phase2 build-aux/flatpak/io.github.osv_ng.Phase2.yml
      - name: Run the installed bootstrap binaries
        run: |
          flatpak-builder --run .flatpak-phase2 build-aux/flatpak/io.github.osv_ng.Phase2.yml osv-app
          flatpak-builder --run .flatpak-phase2 build-aux/flatpak/io.github.osv_ng.Phase2.yml /app/libexec/osv-media-worker
          flatpak-builder --run .flatpak-phase2 build-aux/flatpak/io.github.osv_ng.Phase2.yml /app/libexec/osv-archive-worker
