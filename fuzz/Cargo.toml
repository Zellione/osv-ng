[package]
name = "osv-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
osv-crypto = { path = "../crates/osv-crypto", version = "=0.1.0" }
osv-test-support = { path = "../crates/osv-test-support", version = "=0.1.0" }

[[bin]]
name = "secret-canary"
path = "fuzz_targets/secret-canary.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault-header"
path = "fuzz_targets/vault-header.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
