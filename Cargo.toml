[workspace]
resolver = "3"
members = [
    "crates/osv-app",
    "crates/osv-catalog",
    "crates/osv-crypto",
    "crates/osv-domain",
    "crates/osv-import",
    "crates/osv-media",
    "crates/osv-storage",
    "crates/osv-test-support",
    "helpers/osv-archive-worker",
    "helpers/osv-media-worker",
]
exclude = [
    "fuzz",
    "prototypes/flatpak-smoke",
    "prototypes/gstreamer-seek",
    "prototypes/gtk-gallery",
    "prototypes/media-boundary",
    "prototypes/sqlcipher",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/zellione/osv-ng"

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
getrandom = "0.3.4"
hkdf = "0.12.4"
libc = "0.2.189"
poly1305 = { version = "0.8.0", default-features = false, features = ["zeroize"] }
osv-catalog = { path = "crates/osv-catalog", version = "=0.1.0" }
osv-crypto = { path = "crates/osv-crypto", version = "=0.1.0" }
osv-domain = { path = "crates/osv-domain", version = "=0.1.0" }
osv-import = { path = "crates/osv-import", version = "=0.1.0" }
osv-media = { path = "crates/osv-media", version = "=0.1.0" }
osv-storage = { path = "crates/osv-storage", version = "=0.1.0" }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
sha2 = "0.10.9"
zeroize = { version = "1.8.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "debuginfo"
